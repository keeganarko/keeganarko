<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-label="From Texas A&amp;M to Tesla and Microsoft. Now a product manager at Capital One and co-founding Relay."><title>From Texas A&amp;M to Tesla and Microsoft. Now a product manager at Capital One and co-founding Relay.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}@media (prefers-reduced-motion: reduce){.moving{display:none}}</style><line x1="100" y1="62" x2="900" y2="62" stroke="#3d444d" stroke-width="2.5"/><rect x="39.8" y="45" width="120.4" height="34" rx="17" fill="#500000" stroke="#161b22" stroke-width="2"/><text x="100" y="67.5" font-size="16" font-weight="600" text-anchor="middle" fill="#ffffff">Texas A&amp;M</text><text x="100" y="116" font-size="14" text-anchor="middle" fill="#e6edf3">Computer science,</text><text x="100" y="137" font-size="14" text-anchor="middle" fill="#9198a1">summa cum laude</text><rect x="259.0" y="45" width="82.0" height="34" rx="17" fill="#C8102E" stroke="#161b22" stroke-width="2"/><text x="300" y="67.5" font-size="16" font-weight="600" text-anchor="middle" fill="#ffffff">Tesla</text><text x="300" y="116" font-size="14" text-anchor="middle" fill="#e6edf3">Automated part checks</text><text x="300" y="137" font-size="14" text-anchor="middle" fill="#9198a1">on the assembly line</text><path d="M188 56 l8 6 l-8 6" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="439.8" y="45" width="120.4" height="34" rx="17" fill="#0067B8" stroke="#161b22" stroke-width="2"/><text x="500" y="67.5" font-size="16" font-weight="600" text-anchor="middle" fill="#ffffff">Microsoft</text><text x="500" y="116" font-size="14" text-anchor="middle" fill="#e6edf3">AI products, a paper</text><text x="500" y="137" font-size="14" text-anchor="middle" fill="#9198a1">and a patent</text><path d="M388 56 l8 6 l-8 6" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="625.2" y="40" width="149.6" height="44" rx="22" fill="none" stroke="#FFC53D" stroke-width="3"/><rect x="630.2" y="45" width="139.6" height="34" rx="17" fill="#004977" stroke="#161b22" stroke-width="2"/><text x="700" y="67.5" font-size="16" font-weight="600" text-anchor="middle" fill="#ffffff">Capital One</text><text x="700" y="116" font-size="14" text-anchor="middle" fill="#e6edf3">Moved a card portfolio</text><text x="700" y="137" font-size="14" text-anchor="middle" fill="#9198a1">with no customer outages</text><path d="M588 56 l8 6 l-8 6" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="854.0" y="40" width="92.0" height="44" rx="22" fill="none" stroke="#FFC53D" stroke-width="3"/><rect x="859.0" y="45" width="82.0" height="34" rx="17" fill="#2B5CE6" stroke="#161b22" stroke-width="2"/><text x="900" y="67.5" font-size="16" font-weight="600" text-anchor="middle" fill="#ffffff">Relay</text><text x="900" y="116" font-size="14" text-anchor="middle" fill="#e6edf3">Co-founder,</text><text x="900" y="137" font-size="14" text-anchor="middle" fill="#9198a1">building it now</text><path d="M788 56 l8 6 l-8 6" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="24" font-size="12" font-weight="600" letter-spacing="1.4" text-anchor="middle" fill="#9198a1">NOW</text></svg>
