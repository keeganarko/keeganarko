<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Relay keeps software teams and their AI agents in sync. When two agents head for the same code, Relay warns both people before the merge."><title>Relay keeps software teams and their AI agents in sync. When two agents head for the same code, Relay warns both people before the merge.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}@media (prefers-reduced-motion: reduce){.moving{display:none}}</style><clipPath id="card"><rect width="1000" height="260" rx="18"/></clipPath><rect x="1" y="1" width="998" height="258" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="1" y="1" width="8" height="258" rx="4" fill="#2B5CE6" clip-path="url(#card)"/><text x="52" y="62" font-size="13" font-weight="600" letter-spacing="1.6" fill="#9198a1">WHAT I&#8217;M BUILDING</text><text x="50" y="112" font-size="42" font-weight="700" letter-spacing="-1" fill="#6E9BFF">Relay</text><text x="52" y="152" font-size="20" font-weight="500" fill="#e6edf3">Keeps software teams and their</text><text x="52" y="178" font-size="20" font-weight="500" fill="#e6edf3">AI agents in sync.</text><text x="52" y="222" font-size="16" font-weight="600" fill="#6E9BFF">Try the interactive demo &#8594;</text><path id="mine" d="M520 78 L700 78 C770 78 780 130 850 130 L930 130" fill="none" stroke="#3d444d" stroke-width="2.5"/><path id="theirs" d="M520 182 L700 182 C770 182 780 130 850 130 L930 130" fill="none" stroke="#3d444d" stroke-width="2.5"/><text x="520" y="62" font-size="13" fill="#9198a1">your agent</text><text x="520" y="210" font-size="13" fill="#9198a1">a teammate&#8217;s agent</text><circle cx="930" cy="130" r="11" fill="#161b22" stroke="#e6edf3" stroke-width="2.5"/><text x="930" y="162" font-size="13" text-anchor="middle" fill="#9198a1">merge</text><line x1="742" y1="92" x2="742" y2="168" stroke="#FFC53D" stroke-width="2" stroke-dasharray="5 5"/><circle cx="742" cy="130" r="17" fill="#FFC53D"/><text x="742" y="137" font-size="20" font-weight="800" text-anchor="middle" fill="#17171C">!</text><text x="742" y="245" font-size="13" text-anchor="middle" fill="#e6edf3">Relay warns you both here, before anything lands</text><rect class="moving" x="-9" y="-9" width="18" height="18" rx="5" fill="#FFF6E8"><animateMotion dur="5s" begin="0s" repeatCount="indefinite" keyPoints="0;.5;.5;0" keyTimes="0;.45;.85;1" calcMode="linear"><mpath href="#mine"/></animateMotion></rect><rect class="moving" x="-9" y="-9" width="18" height="18" rx="5" fill="#E05260"><animateMotion dur="5s" begin="0.5s" repeatCount="indefinite" keyPoints="0;.5;.5;0" keyTimes="0;.45;.85;1" calcMode="linear"><mpath href="#theirs"/></animateMotion></rect></svg>
